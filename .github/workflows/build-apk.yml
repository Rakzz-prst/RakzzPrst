name: Build Rakzz-Prst APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir android-project
          unzip -q RakzzPrstAndroid_Animasi_Professional.zip -d android-project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

            - name: Fix Kotlin dependencies
        run: |
          cat > /tmp/force-kotlin.gradle <<'EOF'
          allprojects {
              configurations.all {
                  resolutionStrategy.eachDependency { details ->
                      if (details.requested.group == "org.jetbrains.kotlin") {
                          details.useVersion "1.8.22"
                      }
                  }
              }
          }
          EOF

      - name: Build APK
        run: |
          gradle -p android-project --init-script /tmp/force-kotlin.gradle :app:assembleDebug
        
      

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rakzz-Prst-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
